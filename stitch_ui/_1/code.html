<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>

</div>

</div>
</div>

<div class="space-y-1.5">
  <label class="block text-xs font-bold text-gray-800">
    العنوان <span class="text-red-500">*</span>
  </label>
  <div class="relative">
    <input class="w-full h-11 pr-10 pl-3 rounded-xl border border-gray-200 text-sm font-medium text-gray-800 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#1e3f2e]/20 focus:border-[#1e3f2e] transition" placeholder="مثال: استخراج شهادة رسمية من قلم الجدول" type="text" value="استخراج شهادة رسمية من قلم الجدول">

      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">

</div>

<!-- Field 3: Work Date (موعد العمل) -->
<div class="space-y-1.5">
  <label class="block text-xs font-bold text-gray-800">
    موعد العمل <span class="text-red-500">*</span>
  </label>
  <div class="relative">
    <div class="w-full h-11 px-3 rounded-xl border border-gray-200 flex items-center justify-between bg-white text-sm font-medium text-gray-800">
      <div class="flex items-center gap-2">
