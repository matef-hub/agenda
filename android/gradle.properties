org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=512m --enable-native-access=ALL-UNNAMED -XX:+HeapDumpOnOutOfMemoryError

# تخصيص ذاكرة صريحة لعملية Kotlin Daemon المستقلة
kotlin.daemon.jvmargs=-Xmx1536m

# تسريع البناء: التوازي، الكاش، ومراقبة الملفات
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true

android.useAndroidX=true
android.newDsl=false
android.builtInKotlin=false